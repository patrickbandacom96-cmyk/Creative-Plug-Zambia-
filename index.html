<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Creative Plug Zambia</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0b1220">
<style>
:root{--bg:#0b1220;--card:#151f33;--line:#26344f;--tx:#eef2f9;--mut:#93a1ba;--ac:#19c3a6;--bad:#ff6b6b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif;padding-bottom:80px}
.w{max-width:560px;margin:auto;padding:16px}h1{margin:0;font-size:22px}h2{font-size:18px;margin:18px 0 8px}
.sub{color:var(--mut);font-size:14px;margin:2px 0 14px}
.c{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#0e1729;color:var(--tx);font:inherit}
textarea{min-height:80px}
button{background:var(--ac);color:#04251f;border:0;border-radius:10px;padding:12px 16px;font:600 16px system-ui;width:100%;margin-top:12px}
button.s{background:#22304b;color:var(--tx)}button.sm{width:auto;padding:8px 12px;font-size:14px;margin:0}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.mut{color:var(--mut);font-size:13px}
.tot{font-size:22px;font-weight:700;color:var(--ac);margin-top:10px}
.b{display:inline-block;padding:3px 9px;border-radius:99px;font-size:12px;background:#22304b}
.Pending{color:#ffd166}.Confirmed{color:#6ec1ff}.In{color:#c9a7ff}.Completed{color:var(--ac)}
nav{position:fixed;bottom:0;left:0;right:0;background:#0e1729;border-top:1px solid var(--line);display:flex;overflow-x:auto}
nav a{flex:1;min-width:64px;text-align:center;padding:12px 6px;font-size:12px;color:var(--mut)}
nav a.on{color:var(--ac);font-weight:700}
.m{position:fixed;inset:0;background:#000b;overflow:auto;padding:14px;display:none;z-index:5}
.m>div{max-width:520px;margin:auto;background:var(--card);border-radius:14px;padding:16px}
.doc{background:#fff;color:#111;border-radius:10px;padding:16px;font-size:14px}.doc td{padding:4px 0}
#toast{position:fixed;top:12px;left:12px;right:12px;background:var(--ac);color:#04251f;padding:12px;border-radius:10px;font-weight:700;display:none;z-index:9}
.hid{display:none}a{color:var(--ac)}
#ibar{position:sticky;top:0;z-index:8;background:#0e1729;border-bottom:1px solid var(--ac);padding:8px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px}
#ibar.hid{display:none}
</style></head><body>
<div id="toast"></div>
<div id="ibar" class="hid"><span>Get the Creative Plug Zambia app</span><button id="inst" class="sm" type="button">Install</button></div>

<!-- CUSTOMER SIDE -->
<div id="cust" class="w">
  <h1>Creative Plug Zambia</h1><div class="sub">Plug into Creativity.</div>
  <div class="c">
    <h2 style="margin-top:0">Place an order</h2>
    <label>Your name</label><input id="cn">
    <label>Phone / WhatsApp</label><input id="cp" type="tel" placeholder="097...">
    <label>Service</label><select id="cs"></select>
    <label>Quantity</label><input id="cq" type="number" min="1" value="1">
    <label>Details of what you want</label><textarea id="cd"></textarea>
    <div class="tot" id="ct">K0</div>
    <button id="co">Send order</button>
    <div id="cm" class="sub"></div>
  </div>
  <div class="c">
    <h2 style="margin-top:0">Track your order</h2>
    <input id="tn" placeholder="Order number e.g. CPZ-0001"><label>Phone used on the order</label><input id="tp" type="tel">
    <button class="s" id="tb">Check status</button><div id="tr" class="sub"></div>
  </div>
  <p class="mut" style="text-align:center">WhatsApp/Call: 0977934234 · <a href="#" id="adm">Admin</a></p>
</div>

<!-- ADMIN LOGIN -->
<div id="login" class="w hid">
  <h1>Admin login</h1><div class="sub">Owner only</div>
  <div class="c"><label>Email</label><input id="le" type="email"><label>Password</label><input id="lp" type="password">
  <button id="lb">Log in</button><div id="lm" class="sub" style="color:var(--bad)"></div></div>
  <p style="text-align:center"><a href="#" id="back">← Back to customer page</a></p>
</div>

<!-- ADMIN -->
<div id="admin" class="w hid"><div class="row"><h1 id="at">Orders</h1><button class="sm s" id="lo">Log out</button></div><button id="pushBtn" class="s" type="button">🔔 Turn on phone alerts for new orders</button><div id="av" style="margin-top:12px"></div></div>
<nav id="nav" class="hid">
  <a data-t="orders">Orders</a><a data-t="invoices">Invoices</a><a data-t="receipts">Receipts</a><a data-t="payments">Payments</a><a data-t="sales">Sales</a><a data-t="services">Services</a>
</nav>
<div class="m" id="md"><div id="mc"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// ====== PASTE YOUR TWO VALUES HERE ======
const SUPABASE_URL="https://pzosbgpdohtupzyyloyn.supabase.co";
const SUPABASE_KEY="sb_publishable_zIkkukFX1b8_DxHI8g9yuQ_bNRUJE4r";
// ========================================
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=i=>document.getElementById(i);
const K=n=>"K"+Number(n||0).toLocaleString();
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const D=d=>new Date(d).toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"});
const wa=p=>{p=String(p).replace(/\D/g,"");return p.startsWith("0")?"260"+p.slice(1):p};
const STAT=["Pending","Confirmed","In Progress","Completed"],METH=["Cash","Airtel Money","MTN Money","Zamtel Kwacha","Bank"];
let svc=[],ord=[],pay=[],tab="orders",last=null,timer=null;
const show=id=>["cust","login","admin"].forEach(x=>$(x).classList.toggle("hid",x!==id));

/* ---------- Customer ---------- */
async function loadSvc(){
  const{data}=await sb.from("cpz_services").select("*").eq("active",true).order("id");
  svc=data||[];$("cs").innerHTML=svc.map(s=>`<option value="${s.id}">${esc(s.name)} — ${K(s.price)}</option>`).join("");tot();
}
function tot(){const s=svc.find(x=>x.id==$("cs").value);$("ct").textContent="Total: "+K((s?s.price:0)*Math.max(1,+$("cq").value||1))}
$("cs").onchange=$("cq").oninput=tot;
$("co").onclick=async()=>{
  const n=$("cn").value.trim(),p=$("cp").value.trim();
  if(!n||!p){$("cm").textContent="Please enter your name and phone.";return}
  $("co").disabled=true;
  const{data,error}=await sb.rpc("place_order",{p_name:n,p_phone:p,p_service:+$("cs").value,p_qty:Math.max(1,+$("cq").value||1),p_details:$("cd").value});
  $("co").disabled=false;
  if(error){$("cm").textContent="Could not send: "+error.message;return}
  $("cm").innerHTML=`✅ Order sent! Your order number is <b>${esc(data)}</b>. Keep it to track your order.`;
  $("tn").value=data;$("tp").value=p;$("cd").value="";
};
$("tb").onclick=async()=>{
  const{data,error}=await sb.rpc("track_order",{p_no:$("tn").value,p_phone:$("tp").value});
  if(error||!data||!data.length){$("tr").textContent="Order not found. Check the number and phone.";return}
  const o=data[0];$("tr").innerHTML=`<b>${esc(o.order_no)}</b> · ${esc(o.service_name)} × ${o.qty}<br>Total ${K(o.total)}<br>Status: <b>${esc(o.status)}</b>`;
};
let dp=null;addEventListener("beforeinstallprompt",e=>{e.preventDefault();dp=e;$("ibar").classList.remove("hid")});
$("inst").onclick=async()=>{if(dp){dp.prompt();dp=null;$("ibar").classList.add("hid")}};
addEventListener("appinstalled",()=>$("ibar").classList.add("hid"));

/* ---------- Auth ---------- */
$("adm").onclick=async e=>{e.preventDefault();const{data}=await sb.auth.getSession();data.session?openAdmin():show("login")};
$("back").onclick=e=>{e.preventDefault();show("cust")};
$("lb").onclick=async()=>{
  const{error}=await sb.auth.signInWithPassword({email:$("le").value.trim(),password:$("lp").value});
  if(error){$("lm").textContent=error.message;return}openAdmin();
};
$("lo").onclick=async()=>{await sb.auth.signOut();clearInterval(timer);$("nav").classList.add("hid");show("cust")};

/* ---------- Admin ---------- */
async function openAdmin(){
  show("admin");$("nav").classList.remove("hid");
  if("Notification" in window&&Notification.permission==="default")Notification.requestPermission();
  setupPush(false);await refresh(true);clearInterval(timer);timer=setInterval(()=>refresh(false),20000);
}
async function refresh(first){
  const[a,b,c]=await Promise.all([sb.from("cpz_orders").select("*").order("created_at",{ascending:false}),sb.from("cpz_payments").select("*").order("created_at",{ascending:false}),sb.from("cpz_services").select("*").order("id")]);
  ord=a.data||[];pay=b.data||[];svc=c.data||[];
  if(!first&&last!==null&&ord.length>last){
    const o=ord[0],m=`New order ${o.order_no} from ${o.customer_name}`;
    $("toast").textContent="🔔 "+m;$("toast").style.display="block";setTimeout(()=>$("toast").style.display="none",6000);
    navigator.vibrate&&navigator.vibrate(300);
    if("Notification" in window&&Notification.permission==="granted")new Notification("Creative Plug Zambia",{body:m});
  }
  last=ord.length;render();
}
document.querySelectorAll("nav a").forEach(a=>a.onclick=()=>{tab=a.dataset.t;render()});
const paid=o=>pay.filter(p=>p.order_id===o.id).reduce((s,p)=>s+ +p.amount,0);
const ps=o=>{const p=paid(o);return p>=o.total&&o.total>0?"Paid":p>0?"Part paid":"Unpaid"};
function render(){
  document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.dataset.t===tab));
  $("at").textContent=tab[0].toUpperCase()+tab.slice(1);
  const v=$("av");
  if(tab==="orders")v.innerHTML=ord.map(o=>`<div class="c" onclick="openOrder(${o.id})"><div class="row"><b>${esc(o.order_no)}</b><span class="b ${o.status.split(" ")[0]}">${esc(o.status)}</span></div><div>${esc(o.customer_name)} · ${esc(o.service_name)} × ${o.qty}</div><div class="mut">${K(o.total)} · ${ps(o)} · ${D(o.created_at)}</div></div>`).join("")||'<p class="mut">No orders yet.</p>';
  if(tab==="invoices")v.innerHTML=ord.map(o=>`<div class="c" onclick="openDoc('inv',${o.id})"><div class="row"><b>INV-${esc(o.order_no.slice(4))}</b><b>${K(o.total)}</b></div><div class="mut">${esc(o.customer_name)} · ${ps(o)} · ${D(o.created_at)}</div></div>`).join("")||'<p class="mut">No invoices yet.</p>';
  if(tab==="receipts")v.innerHTML=pay.map(p=>`<div class="c" onclick="openDoc('rec',${p.id})"><div class="row"><b>REC-${String(p.id).padStart(4,"0")}</b><b>${K(p.amount)}</b></div><div class="mut">${esc(p.order_no)} · ${esc(p.method)} · ${D(p.created_at)}</div></div>`).join("")||'<p class="mut">No receipts yet. Record a payment on an order.</p>';
  if(tab==="payments"){
    const by={};pay.forEach(p=>by[p.method]=(by[p.method]||0)+ +p.amount);
    v.innerHTML=`<div class="c">${Object.keys(by).map(m=>`<div class="row"><span>${esc(m)}</span><b>${K(by[m])}</b></div>`).join("")||'<span class="mut">No payments yet.</span>'}</div>`+pay.map(p=>`<div class="c"><div class="row"><b>${K(p.amount)}</b><span>${esc(p.method)}</span></div><div class="mut">${esc(p.order_no)} · ${D(p.created_at)}</div></div>`).join("");
  }
  if(tab==="sales"){
    const now=new Date(),sum=f=>pay.filter(f).reduce((s,p)=>s+ +p.amount,0),dt=p=>new Date(p.created_at);
    const today=sum(p=>dt(p).toDateString()===now.toDateString()),month=sum(p=>dt(p).getMonth()===now.getMonth()&&dt(p).getFullYear()===now.getFullYear()),all=sum(()=>true);
    const billed=ord.reduce((s,o)=>s+ +o.total,0),by={};ord.forEach(o=>{by[o.service_name]=(by[o.service_name]||0)+ +o.total});
    v.innerHTML=`<div class="c"><div class="row"><span>Received today</span><b>${K(today)}</b></div><div class="row"><span>Received this month</span><b>${K(month)}</b></div><div class="row"><span>Received in total</span><b>${K(all)}</b></div><div class="row"><span>Total billed</span><b>${K(billed)}</b></div><div class="row"><span>Still owed</span><b style="color:var(--bad)">${K(billed-all)}</b></div><div class="row"><span>Orders</span><b>${ord.length}</b></div></div><h2>By service</h2>`+Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([n,t])=>`<div class="c row"><span>${esc(n)}</span><b>${K(t)}</b></div>`).join("");
  }
  if(tab==="services")v.innerHTML=svc.map(s=>`<div class="c"><input id="sn${s.id}" value="${esc(s.name)}"><label>Price (K)</label><input id="sp${s.id}" type="number" value="${s.price}"><div class="row"><button class="sm" onclick="saveSvc(${s.id})">Save</button><button class="sm s" onclick="togSvc(${s.id},${!s.active})">${s.active?"Disable":"Enable"}</button></div></div>`).join("")+`<div class="c"><b>Add service</b><input id="nn" placeholder="Name" style="margin-top:8px"><input id="np" type="number" placeholder="Price" style="margin-top:8px"><button onclick="addSvc()">Add</button></div>`;
}
const O=id=>ord.find(o=>o.id===id);
const closeM=()=>$("md").style.display="none";
function openM(h){$("mc").innerHTML=h;$("md").style.display="block"}
window.openOrder=id=>{const o=O(id);
  openM(`<div class="row"><h2 style="margin:0">${esc(o.order_no)}</h2><button class="sm s" onclick="closeM()">Close</button></div>
  <div class="mut">${esc(o.customer_name)} · ${esc(o.phone)} · ${D(o.created_at)}</div>
  <div style="margin:8px 0"><b>${esc(o.service_name)}</b> @ ${K(o.unit_price)}</div>
  <label>Quantity</label><input id="oq" type="number" min="1" value="${o.qty}">
  <label>Details</label><textarea id="od">${esc(o.details)}</textarea>
  <label>Status</label><select id="os">${STAT.map(s=>`<option ${s===o.status?"selected":""}>${s}</option>`).join("")}</select>
  <button onclick="saveOrder(${id})">Save changes</button>
  <a href="https://wa.me/${wa(o.phone)}?text=${encodeURIComponent("Hello "+o.customer_name+", about your order "+o.order_no+": ")}" target="_blank"><button class="s">Message customer on WhatsApp</button></a>
  <h2>Payment · ${ps(o)} (${K(paid(o))} of ${K(o.total)})</h2>
  <input id="pa" type="number" placeholder="Amount" value="${Math.max(0,o.total-paid(o))}"><label>Method</label><select id="pm">${METH.map(m=>`<option>${m}</option>`).join("")}</select>
  <button onclick="addPay(${id})">Record payment</button>
  <button class="s" onclick="openDoc('inv',${id})">View invoice</button>
  <button class="s" style="color:var(--bad)" onclick="delOrder(${id})">Delete order</button>`)};
window.closeM=closeM;
window.saveOrder=async id=>{const o=O(id),q=Math.max(1,+$("oq").value||1);
  const{error}=await sb.from("cpz_orders").update({qty:q,total:o.unit_price*q,details:$("od").value,status:$("os").value}).eq("id",id);
  if(error)alert(error.message);closeM();refresh(true)};
window.addPay=async id=>{const o=O(id),a=+$("pa").value;if(!a)return;
  const{error}=await sb.from("cpz_payments").insert({order_id:id,order_no:o.order_no,amount:a,method:$("pm").value});
  if(error)alert(error.message);closeM();tab="receipts";refresh(true)};
window.delOrder=async id=>{if(!confirm("Delete this order and its payments?"))return;await sb.from("cpz_orders").delete().eq("id",id);closeM();refresh(true)};
window.openDoc=(t,id)=>{let o,p,title,rows;
  if(t==="inv"){o=O(id);title="INVOICE INV-"+o.order_no.slice(4);rows=`<tr><td>${esc(o.service_name)} × ${o.qty}</td><td align="right">${K(o.total)}</td></tr><tr><td>Paid</td><td align="right">${K(paid(o))}</td></tr><tr><td><b>Balance</b></td><td align="right"><b>${K(o.total-paid(o))}</b></td></tr>`}
  else{p=pay.find(x=>x.id===id);o=ord.find(x=>x.id===p.order_id)||{customer_name:"",phone:"",order_no:p.order_no};title="RECEIPT REC-"+String(p.id).padStart(4,"0");rows=`<tr><td>Payment for ${esc(p.order_no)}</td><td align="right">${K(p.amount)}</td></tr><tr><td>Method</td><td align="right">${esc(p.method)}</td></tr>`}
  const txt=`${title}\nCreative Plug Zambia\nCustomer: ${o.customer_name}\n`+rows.replace(/<\/tr>/g,"\n").replace(/<\/td><td[^>]*>/g,": ").replace(/<[^>]+>/g,"").replace(/&times;/g,"×");
  openM(`<div class="doc"><b style="font-size:18px">Creative Plug Zambia</b><br><span>Plug into Creativity · 0977934234</span><hr><b>${title}</b><br>Date: ${D(p?p.created_at:o.created_at)}<br>Customer: ${esc(o.customer_name)} (${esc(o.phone)})<table width="100%" style="margin-top:8px">${rows}</table></div>
  <a href="https://wa.me/${wa(o.phone)}?text=${encodeURIComponent(txt)}" target="_blank"><button>Send on WhatsApp</button></a><button class="s" onclick="print()">Print / Save PDF</button><button class="s" onclick="closeM()">Close</button>`)};
window.saveSvc=async id=>{await sb.from("cpz_services").update({name:$("sn"+id).value,price:+$("sp"+id).value||0}).eq("id",id);refresh(true)};
window.togSvc=async(id,a)=>{await sb.from("cpz_services").update({active:a}).eq("id",id);refresh(true)};
window.addSvc=async()=>{if(!$("nn").value)return;await sb.from("cpz_services").insert({name:$("nn").value,price:+$("np").value||0});refresh(true)};

/* ---------- Phone alerts (push) ---------- */
const VAPID_PUBLIC="BNCjptAzIs1-pMa4V0RH59BVgl3xhV53b9kv9vUotI7_hyVpeliahuO62Ac74kVT8PrIxz6FQbAjLu86JwdaAa4";
const b64=s=>{const p="=".repeat((4-s.length%4)%4),r=atob((s+p).replace(/-/g,"+").replace(/_/g,"/"));return Uint8Array.from([...r].map(c=>c.charCodeAt(0)))};
async function setupPush(ask){
  if(!("serviceWorker" in navigator)||!("PushManager" in window)){if(ask)alert("This browser cannot receive alerts. Please use Chrome and install the app.");return}
  try{
    const reg=await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub){
      if(!ask)return;
      const perm=await Notification.requestPermission();
      if(perm!=="granted"){alert("Please allow notifications for this app in your phone settings, then try again.");return}
      sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64(VAPID_PUBLIC)});
    }
    const j=sub.toJSON();
    const{error}=await sb.from("cpz_push_subs").upsert({endpoint:j.endpoint,p256dh:j.keys.p256dh,auth:j.keys.auth},{onConflict:"endpoint"});
    if(error){if(ask)alert("Could not save alerts: "+error.message);return}
    $("pushBtn").classList.add("hid");
    if(ask)alert("Phone alerts are ON \u2705");
  }catch(e){if(ask)alert("Could not turn on alerts: "+e.message)}
}
$("pushBtn").onclick=()=>setupPush(true);

loadSvc();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
